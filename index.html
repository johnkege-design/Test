<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Zetseat Church Portal</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
rel="stylesheet"
/>

<style>
::-webkit-scrollbar{
display:none;
}

body{
-webkit-tap-highlight-color:transparent;
}

.page{
display:none;
animation:fadeIn .25s ease;
}

.page.active{
display:block;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body class="bg-white dark:bg-slate-950 text-slate-800 dark:text-white pb-28 transition-all duration-300">

<header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-900 px-4 py-3 flex items-center justify-between">

<div class="flex items-center gap-3">

<svg class="h-10" viewBox="0 0 178 77" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M22.5 0L38.5 24.5L13.5 53.5L3.5 41L22.5 0Z" fill="#F5B300"/>
<path d="M13.5 53.5L24.5 48.5L20.5 63.5L10.5 77L13.5 53.5Z" fill="#E0A300"/>
<path d="M20.5 63.5L25.5 59.5L27.5 73.5L20.5 63.5Z" fill="#C79200"/>

<text x="46" y="44" fill="currentColor" font-family="sans-serif" font-weight="900" font-size="34">
zetseat
</text>

<text x="47" y="58" fill="#999" font-family="sans-serif" font-weight="500" font-size="8.5">
Apostolic Reformation Church
</text>
</svg>

</div>

<div class="flex items-center gap-2">

<button onclick="toggleDarkMode()"
class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center">

<span class="material-symbols-rounded dark:hidden">dark_mode</span>

<span class="material-symbols-rounded hidden dark:block text-yellow-400">
light_mode
</span>

</button>

<button onclick="toggleMemberModal()"
class="px-4 py-2 rounded-2xl bg-yellow-500 text-slate-950 font-black text-xs">
JOIN US
</button>

</div>

</header>

<div class="px-4 mt-4 max-w-md mx-auto">

<div class="rounded-3xl bg-gradient-to-r from-yellow-500/10 to-transparent border border-yellow-500/20 p-5 text-center">

<div class="text-[10px] uppercase tracking-[0.25em] text-yellow-500 font-black mb-2">
OUR MISSION
</div>

<div class="text-lg font-black leading-tight">
“To see a generation suitable to God risen in the whole world.”
</div>

</div>

</div>

<main id="main-content" class="max-w-md mx-auto px-4 mt-6 space-y-5">

<section id="page-home" class="page active space-y-4">

<div>
<h1 class="text-2xl font-black">Timeline</h1>
<p class="text-xs text-slate-400">Live updates and ministry streams</p>
</div>

<div id="programs-container" class="space-y-4"></div>

</section>

<section id="page-events" class="page space-y-4">

<div>
<h1 class="text-2xl font-black">Upcoming Events</h1>
</div>

<div class="rounded-3xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">

<h2 class="text-xl font-black">
City Outreach Campaign
</h2>

<p class="text-sm text-slate-400 mt-2">
Meeting at Sarbet Mother Church before evangelism deployment.
</p>

</div>

</section>

<section id="page-prayers" class="page space-y-4">

<div>
<h1 class="text-2xl font-black">Prayer Center</h1>
</div>

<form id="prayer-form"
class="rounded-3xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-4">

<input
id="prayer-name"
type="text"
placeholder="Your name"
class="w-full rounded-2xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-3 text-sm"
/>

<textarea
id="prayer-text"
rows="4"
placeholder="Prayer request..."
class="w-full rounded-2xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-3 text-sm resize-none"></textarea>

<button class="w-full rounded-2xl bg-yellow-500 py-3 text-slate-950 font-black">
SEND REQUEST
</button>

</form>

</section>

<section id="page-about" class="page space-y-4">

<div>
<h1 class="text-2xl font-black">Branches</h1>
</div>

<div id="branches-container" class="space-y-3"></div>

</section>

</main>

<section id="page-bible" class="page fixed inset-0 z-40 bg-white dark:bg-slate-950 pt-16">

<iframe
src="https://www.bible.com/bible/3867/GEN.1.አማ54"
class="w-full h-full border-0">
</iframe>

</section>

<nav class="fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto px-3 pb-4">

<div class="bg-slate-950/80 backdrop-blur-md rounded-[2rem] border border-slate-800 py-3 px-2 flex items-center justify-around">

<button onclick="openPage('page-home', this)"
class="nav-btn text-yellow-500 flex flex-col items-center gap-1">

<span class="material-symbols-rounded">home</span>
<span class="text-[10px] font-bold">Home</span>

</button>

<button onclick="openPage('page-events', this)"
class="nav-btn text-slate-500 flex flex-col items-center gap-1">

<span class="material-symbols-rounded">event</span>
<span class="text-[10px] font-bold">Events</span>

</button>

<button onclick="openBible()" class="relative -mt-14">

<div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 to-yellow-600 flex items-center justify-center shadow-[0_10px_35px_rgba(255,196,0,0.4)] border-4 border-slate-950">

<span class="material-symbols-rounded text-4xl text-slate-950">
auto_stories
</span>

</div>

</button>

<button onclick="openPage('page-prayers', this)"
class="nav-btn text-slate-500 flex flex-col items-center gap-1">

<span class="material-symbols-rounded">volunteer_activism</span>
<span class="text-[10px] font-bold">Prayer</span>

</button>

<button onclick="openPage('page-about', this)"
class="nav-btn text-slate-500 flex flex-col items-center gap-1">

<span class="material-symbols-rounded">info</span>
<span class="text-[10px] font-bold">About</span>

</button>

</div>

</nav>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzvHiAuYAriIQJaLnXcjaNiK-McCRMt7khNrKNHX29E7tIjWeTKjhegNcGyKsSWXsFcDQ/exec";

function openPage(pageId, btn){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

document.querySelectorAll('.nav-btn').forEach(btn=>{
btn.classList.remove('text-yellow-500');
btn.classList.add('text-slate-500');
});

if(btn){
btn.classList.remove('text-slate-500');
btn.classList.add('text-yellow-500');
}

document.getElementById('main-content').style.display='block';

if(pageId==='page-bible'){
document.getElementById('main-content').style.display='none';
}

}

function openBible(){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById('page-bible').classList.add('active');

document.getElementById('main-content').style.display='none';

}

function toggleDarkMode(){
document.documentElement.classList.toggle('dark');
}

function toggleMemberModal(){
alert('Member modal connected.');
}

async function loadPrograms(){

const container=document.getElementById('programs-container');

try{

const response=await fetch(API_URL+'?action=getPrograms');

const result=await response.json();

container.innerHTML='';

result.data.reverse().forEach(item=>{

container.innerHTML+=`

<div class="rounded-3xl overflow-hidden bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">

${item.image ? `
<img src="${item.image}" class="w-full max-h-80 object-cover">
`:''}

<div class="p-5 space-y-3">

<div class="flex items-center justify-between">

<span class="text-[10px] uppercase tracking-widest font-black text-yellow-500">
${item.category || 'Announcement'}
</span>

<span class="text-xs text-slate-400">
${item.date || ''}
</span>

</div>

<h2 class="text-xl font-black">
${item.title || ''}
</h2>

<p class="text-sm text-slate-400">
${item.description || ''}
</p>

</div>

</div>

`;

});

}catch(error){

container.innerHTML=`
<div class="rounded-3xl bg-red-500/10 border border-red-500/20 p-5 text-center text-red-400">
Failed loading feed.
</div>
`;

}

}

const branches=[
'Sarbet Mother Church',
'Bulbula Branch',
'CMC Branch',
'Adola Branch',
'Hossana Branch',
'Mekele Branch',
'Bahirdar Branch',
'USA DC Branch',
'Netherland Branch'
];

const branchContainer=document.getElementById('branches-container');

branches.forEach(branch=>{

branchContainer.innerHTML+=`

<div class="rounded-3xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">

<div class="flex items-center justify-between">

<h3 class="font-black text-sm">
${branch}
</h3>

<span class="material-symbols-rounded text-yellow-500">
church
</span>

</div>

<div class="mt-4 space-y-2 text-xs text-slate-400">

<div class="flex items-center justify-between">
<span>Wednesday Evening</span>
<span>5:30 PM</span>
</div>

<div class="flex items-center justify-between">
<span>Sunday Morning</span>
<span>8:00 AM</span>
</div>

</div>

</div>

`;

});

loadPrograms();

</script>

</body>
</html>
